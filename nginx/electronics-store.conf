# Кэш для on-the-fly ресайза изображений
# Добавить в http блок (/etc/nginx/nginx.conf):
# proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=images:10m max_size=1g inactive=30d;

server {
    listen 80;
    server_name 176.57.208.112;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # SPA — хэшированные ассеты с immutable кэшем
    location /assets/ {
        root /var/www/electronics-store/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA — index.html без кэша
    location / {
        root /var/www/electronics-store/dist;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # API proxy
    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads — proxy_cache для on-the-fly ресайза
    location /uploads {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache images;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public";
        add_header Vary "Accept";
        add_header X-Cache-Status $upstream_cache_status;
    }

    client_max_body_size 10M;
}
